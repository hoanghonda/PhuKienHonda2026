<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>XNT Phụ Tùng — HEAD Việt Thái Q.2</title>

<!-- ════════════════════════════════════════════════
     🔧 CẤU HÌNH FIREBASE — ĐIỀN VÀO ĐÂY
     Lấy từ: Firebase Console → Project Settings → Your apps

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue, push, remove, set, get }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyClCEFqEXoxiv8SEoBMd6Rb6GIcIZxgH3A",
    authDomain: "phukien2026-a2fe6.firebaseapp.com",
    databaseURL: "https://phukien2026-a2fe6-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "phukien2026-a2fe6",
    storageBucket: "phukien2026-a2fe6.firebasestorage.app",
    messagingSenderId: "1016615175099",
    appId: "1:1016615175099:web:10ae58fc95a11e0fe83a9e"
  };

  // ── Khởi tạo Firebase ──────────────────────────
  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);

  // ── Dữ liệu cố định ────────────────────────────
  const PARTS = [
    // ── Thảm chân ─────────────────────────────────
    { ten: "Thảm AB Inox",             ma: "HLSACK3AGFLP02", giaChi: 140000  },
    { ten: "Thảm SH Mode thường",      ma: "HLSACK1NAFLP03", giaChi: 72000  },
    { ten: "Thảm SH Mode Inox",        ma: "HLSACK1NAFLP02", giaChi: 140000 },
    { ten: "Thảm Vision thường",       ma: "HLSACK2CAFLP03", giaChi: 72000  },
    { ten: "Thảm LEAD thường",         ma: "HLSACK2TAFLP01", giaChi: 72000  },
    { ten: "Thảm SH Lớn Cao cấp Inox",ma: "HLSACK0RPFLP02", giaChi: 140000 },
  ];

  const TON_DAU = {
    // Thảm chân (tồn đầu tháng 03/2026 — gốc của chuỗi tính tồn)
    HLSACK3AGFLP02: 10, HLSACK1NAFLP03: 11, HLSACK1NAFLP02: 4,
    HLSACK2CAFLP03: 30, HLSACK2TAFLP01: 9,  HLSACK0RPFLP02: 13,
  };

  // Chuỗi đầy đủ để tính tồn kế thừa (03→05 vẫn cần tính ngầm
  // vì giao dịch cũ nằm trong Firebase, nhưng KHÔNG hiển thị trên UI)
  const THANG_ALL = [
    "2026-03","2026-04","2026-05","2026-06",
    "2026-07","2026-08","2026-09","2026-10","2026-11","2026-12",
  ];
  // Các tháng hiển thị cho người dùng chọn
  const THANG_OPTIONS = [
    "2026-06","2026-07","2026-08","2026-09","2026-10","2026-11","2026-12",
  ];

  // ── State ───────────────────────────────────────
  let giaoDich  = {}; // Firebase key → object
  let thanhToan = {};
  let kiemKe    = {}; // tuầnKey ("2026-W32") → biên bản kiểm kê
  let tab       = "tonkho";
  let thang     = "2026-07";
  let editingKey = null; // key đang sửa (null = thêm mới)

  // ── Helpers ─────────────────────────────────────
  const fmt    = n => new Intl.NumberFormat("vi-VN").format(n) + "đ";
  const fmtNum = n => new Intl.NumberFormat("vi-VN").format(n);
  const thangLabel = t => "Tháng " + t.replace("2026-","") + "/2026";
  // Chống XSS: escape mọi text người dùng nhập trước khi đưa vào innerHTML
  const esc = s => String(s ?? "").replace(/[&<>"']/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // ── Khôi phục tab/tháng từ URL (?tab=...&thang=...) ──
  {
    const q = new URLSearchParams(location.search);
    const qt = q.get("tab"), qm = q.get("thang");
    if (["tonkho","lichtsu","quybaga","vonno","kiemke"].includes(qt)) tab = qt;
    if (THANG_OPTIONS.includes(qm)) thang = qm;
  }
  function syncURL() {
    const q = new URLSearchParams();
    q.set("tab", tab); q.set("thang", thang);
    history.replaceState(null, "", "?" + q.toString());
  }

  // Cache kết quả tính tồn theo tháng — xoá khi dữ liệu Firebase thay đổi
  let tonCache = {};

  function tinhTon(thangStr) {
    if (tonCache[thangStr]) return tonCache[thangStr];

    // Tháng đầu chuỗi (2026-03) lấy TON_DAU cố định,
    // các tháng sau kế thừa tồn cuối tháng trước (tính đúng 1 lần nhờ cache)
    const idx  = THANG_ALL.indexOf(thangStr);
    const prev = idx > 0 ? tinhTon(THANG_ALL[idx - 1]) : null;

    const gdArr = Object.values(giaoDich).filter(g => g.thang === thangStr);
    const res = {};
    PARTS.forEach(p => {
      const tonDau = prev ? (prev[p.ma]?.tonCuoi ?? 0) : (TON_DAU[p.ma] ?? 0);
      const gdP   = gdArr.filter(g => g.ma === p.ma);
      const nhap  = gdP.filter(g => g.loai==="nhap").reduce((s,g)=>s+g.soLuong,0);
      const xuat  = gdP.filter(g => g.loai==="xuat").reduce((s,g)=>s+g.soLuong,0);
      const baga  = gdP.filter(g => g.loai==="xuat").reduce((s,g)=>s+(g.giaBan-p.giaChi)*g.soLuong,0);
      res[p.ma] = { tonDau, nhap, xuat, tonCuoi: tonDau+nhap-xuat, quybaga:baga };
    });

    tonCache[thangStr] = res;
    return res;
  }

  // ══════════════════════════════════════════════════
  // ── KIỂM KÊ HÀNG TUẦN — sáng thứ 2, hạn chót 10:00 ──
  // ══════════════════════════════════════════════════
  const KK_GIO_HAN = 10; // 10:00 sáng thứ 2

  // Thứ 2 của tuần chứa ngày d (00:00)
  function mondayOf(d) {
    const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    t.setDate(t.getDate() - ((t.getDay() + 6) % 7)); // getDay: CN=0 → Mon=0
    return t;
  }
  // Hạn chót kiểm kê của tuần chứa ngày d = 10:00 thứ 2
  function deadlineOf(d) {
    const m = mondayOf(d); m.setHours(KK_GIO_HAN, 0, 0, 0); return m;
  }
  // Khoá tuần theo chuẩn ISO: "2026-W32"
  function weekKeyOf(d) {
    const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    t.setDate(t.getDate() - ((t.getDay() + 6) % 7) + 3); // thứ 5 của tuần
    const firstThu = new Date(t.getFullYear(), 0, 4);
    firstThu.setDate(firstThu.getDate() - ((firstThu.getDay() + 6) % 7) + 3);
    const w = 1 + Math.round((t - firstThu) / (7 * 86400000));
    return `${t.getFullYear()}-W${String(w).padStart(2, "0")}`;
  }
  const dmy = d => d.toLocaleDateString("vi-VN", { day:"2-digit", month:"2-digit", year:"numeric" });
  const tuanLabel = key => {
    const r = kiemKe[key];
    if (r?.ngayThuHai) { const [y,m,dd] = r.ngayThuHai.split("-"); return `Tuần ${key.split("-W")[1]} (T2 ${dd}/${m})`; }
    return `Tuần ${key.split("-W")[1]}/${key.split("-W")[0]}`;
  };

  // Tháng dùng để lấy tồn hệ thống khi kiểm kê = tháng thực tế hôm nay
  function thangHienTai() {
    const n = new Date();
    const s = `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}`;
    if (THANG_ALL.includes(s)) return s;
    return THANG_ALL[THANG_ALL.length - 1];
  }

  // Trạng thái kiểm kê của tuần hiện tại
  function kkStatus() {
    const now = new Date();
    const key = weekKeyOf(now);
    const han = deadlineOf(now);
    const rec = kiemKe[key] || null;
    if (rec) {
      return { key, han, rec, done: true,
               dungHan: !!rec.dungHan,
               text: rec.dungHan ? "✓ ĐÃ KIỂM KÊ — ĐÚNG HẠN" : "✓ ĐÃ KIỂM KÊ — TRỄ HẠN",
               mau: rec.dungHan ? "green" : "amber" };
    }
    if (now < han) {
      const phut = Math.round((han - now) / 60000);
      const con = phut >= 1440 ? `còn ${Math.floor(phut/1440)} ngày ${Math.floor((phut%1440)/60)} giờ`
                : phut >= 60   ? `còn ${Math.floor(phut/60)} giờ ${phut%60} phút`
                :                `còn ${phut} phút`;
      const gap = phut <= 180;
      return { key, han, rec:null, done:false, quaHan:false,
               text: `⏳ CHƯA KIỂM KÊ TUẦN NÀY — hạn chót 10:00 T2 ${dmy(han)} (${con})`,
               mau: gap ? "amber" : "blue" };
    }
    const treGio = Math.floor((now - han) / 3600000);
    const tre = treGio >= 24 ? `${Math.floor(treGio/24)} ngày` : `${treGio} giờ`;
    return { key, han, rec:null, done:false, quaHan:true,
             text: `⚠ TRỄ HẠN KIỂM KÊ TUẦN NÀY — quá hạn ${tre} (hạn 10:00 T2 ${dmy(han)})`,
             mau: "red" };
  }

  // Tổng hợp một biên bản để hiển thị
  function kkTongHop(rec) {
    let soMaLech = 0, tongLech = 0, giaTriLech = 0;
    PARTS.forEach(p => {
      const it = rec.items?.[p.ma]; if (!it) return;
      const l = (it.thucTe ?? 0) - (it.heThong ?? 0);
      if (l !== 0) { soMaLech++; tongLech += l; giaTriLech += l * p.giaChi; }
    });
    return { soMaLech, tongLech, giaTriLech };
  }

  // ── Banner nhắc kiểm kê (hiện trên mọi tab) ──
  function renderBanner() {
    const el = document.getElementById("kk-banner");
    if (!el) return;
    const st = kkStatus();
    if (st.done || tab === "kiemke") { el.innerHTML = ""; return; }
    el.innerHTML = `<div class="kk-banner ${st.mau}">
        <span>${esc(st.text)}</span>
        <button class="btn ${st.quaHan?"btn-orange":"btn-green"}" style="padding:6px 14px;font-size:12px"
                onclick="openModalKK()">KIỂM KÊ NGAY</button>
      </div>`;
  }

  // ── Nhắc bằng thông báo hệ thống (khi app đang mở) ──
  window.batNhacKK = async function() {
    if (!("Notification" in window)) return toast("Trình duyệt không hỗ trợ thông báo", true);
    const p = await Notification.requestPermission();
    if (p === "granted") { localStorage.setItem("kk-notify","1"); toast("✓ Đã bật nhắc kiểm kê"); render(); }
    else toast("Bạn đã từ chối quyền thông báo", true);
  };
  function kiemTraNhac() {
    renderBanner();
    if (localStorage.getItem("kk-notify") !== "1") return;
    if (Notification.permission !== "granted") return;
    const now = new Date();
    const st  = kkStatus();
    if (st.done) return;
    const isT2 = now.getDay() === 1;
    // Nhắc vào sáng thứ 2 từ 07:00 đến 10:00, tối đa 1 lần/ngày
    if (!isT2 || now.getHours() < 7 || now.getHours() >= KK_GIO_HAN) return;
    const mark = "kk-notified-" + now.toDateString();
    if (localStorage.getItem(mark)) return;
    localStorage.setItem(mark, "1");
    new Notification("Kiểm kê phụ tùng tuần này", {
      body: "Hạn chót 10:00 sáng nay. Mở XNT Phụ Tùng để kiểm kê.",
      tag: "kiemke-tuan"
    });
  }

  // ── Modal kiểm kê ────────────────────────────────
  window.openModalKK = function(readonlyKey = null) {
    const thangKK = thangHienTai();
    const ton = tinhTon(thangKK);
    const rec = readonlyKey ? kiemKe[readonlyKey] : null;
    const st  = kkStatus();

    document.getElementById("kk-title").textContent = rec
      ? `📋 Biên bản kiểm kê — ${tuanLabel(readonlyKey)}`
      : `🗓 Kiểm kê tuần — hạn 10:00 T2 ${dmy(st.han)}`;
    document.getElementById("kk-mode").value = rec ? "view" : "edit";
    document.getElementById("kk-key").value  = readonlyKey || st.key;

    document.getElementById("kk-nv").value = rec?.nguoiThucHien ?? "";
    document.getElementById("kk-nv").disabled = !!rec;
    document.getElementById("kk-ghichu").value = rec?.ghichu ?? "";
    document.getElementById("kk-ghichu").disabled = !!rec;
    document.getElementById("kk-dieuchinh").checked = false;
    document.getElementById("kk-dieuchinh-row").style.display = rec ? "none" : "block";
    document.getElementById("kk-save").style.display = rec ? "none" : "inline-block";
    document.getElementById("kk-meta").innerHTML = rec
      ? `<span style="color:#888;font-size:11px">Thực hiện: ${esc(rec.nguoiThucHien)} — ${esc(rec.thoiGian)}
         ${rec.dungHan?'<span class="kk-pill green">ĐÚNG HẠN</span>':'<span class="kk-pill amber">TRỄ HẠN</span>'}</span>`
      : `<span style="color:#888;font-size:11px">Tồn hệ thống lấy theo ${thangLabel(thangKK)} — đếm thực tế rồi nhập vào cột THỰC TẾ.</span>`;

    document.getElementById("kk-rows").innerHTML = PARTS.map(p => {
      const heThong = rec ? (rec.items?.[p.ma]?.heThong ?? 0) : (ton[p.ma]?.tonCuoi ?? 0);
      const thucTe  = rec ? (rec.items?.[p.ma]?.thucTe ?? 0) : "";
      const lech    = rec ? (thucTe - heThong) : 0;
      return `<tr>
        <td class="thai">${p.ten}</td>
        <td class="r" style="color:#aaa">${heThong}</td>
        <td class="r">${rec
          ? thucTe
          : `<input type="number" class="kk-input" data-ma="${p.ma}" data-ht="${heThong}"
                    min="0" inputmode="numeric" autocomplete="off"
                    aria-label="Số lượng thực tế ${esc(p.ten)}" oninput="kkTinhLech()">`}</td>
        <td class="r kk-lech" data-ma="${p.ma}" style="font-weight:600;color:${lech===0?"#555":(lech>0?"#4ecb7a":"#e05c2a")}">
          ${rec ? (lech===0?"—":(lech>0?"+"+lech:lech)) : "—"}</td>
      </tr>`;
    }).join("");

    document.getElementById("kk-tong").textContent = rec
      ? (() => { const t = kkTongHop(rec); return t.soMaLech===0
          ? "✓ Khớp hoàn toàn" : `${t.soMaLech} mã lệch — giá trị ${fmt(t.giaTriLech)}`; })()
      : "Chưa nhập";

    document.getElementById("modal-kk").style.display = "flex";
    if (!rec) document.getElementById("kk-nv").focus();
  };

  window.closeModalKK = function() { document.getElementById("modal-kk").style.display = "none"; };

  window.kkTinhLech = function() {
    let soMa = 0, giaTri = 0;
    document.querySelectorAll(".kk-input").forEach(inp => {
      const ma = inp.dataset.ma, ht = parseInt(inp.dataset.ht) || 0;
      const raw = inp.value.trim();
      const cell = document.querySelector(`.kk-lech[data-ma="${ma}"]`);
      if (raw === "") { cell.textContent = "—"; cell.style.color = "#555"; return; }
      const tt = parseInt(raw); if (Number.isNaN(tt) || tt < 0) { cell.textContent = "?"; cell.style.color="#e05c2a"; return; }
      const l = tt - ht;
      cell.textContent = l === 0 ? "0" : (l > 0 ? "+" + l : String(l));
      cell.style.color = l === 0 ? "#4ecb7a" : (l > 0 ? "#4ecb7a" : "#e05c2a");
      if (l !== 0) { soMa++; giaTri += l * (PARTS.find(p=>p.ma===ma)?.giaChi ?? 0); }
    });
    document.getElementById("kk-tong").textContent = soMa === 0
      ? "✓ Khớp hoàn toàn" : `${soMa} mã lệch — giá trị ${fmt(giaTri)}`;
  };

  window.saveKK = async function() {
    const nv = document.getElementById("kk-nv").value;
    if (!nv) return toast("Vui lòng chọn người kiểm kê", true);

    const inputs = [...document.querySelectorAll(".kk-input")];
    const items = {}; let thieu = 0;
    for (const inp of inputs) {
      const raw = inp.value.trim();
      if (raw === "") { thieu++; continue; }
      const tt = parseInt(raw);
      if (Number.isNaN(tt) || tt < 0) return toast("Số lượng thực tế không hợp lệ", true);
      items[inp.dataset.ma] = { heThong: parseInt(inp.dataset.ht) || 0, thucTe: tt };
    }
    if (thieu > 0) return toast(`Còn ${thieu} mã chưa đếm — nhập đủ ${PARTS.length} mã`, true);

    const key     = document.getElementById("kk-key").value;
    const thangKK = thangHienTai();
    const now     = new Date();
    const dungHan = now <= deadlineOf(now);
    const dieuChinh = document.getElementById("kk-dieuchinh").checked;

    if (kiemKe[key] && !confirm("Tuần này đã có biên bản kiểm kê. Ghi đè?")) return;

    const btn = document.getElementById("kk-save");
    const lbl = btn.textContent; btn.textContent = "Đang lưu…"; btn.disabled = true;
    try {
      await set(ref(db, "kiemke/" + key), {
        tuan: key,
        ngayThuHai: (m => `${m.getFullYear()}-${String(m.getMonth()+1).padStart(2,"0")}-${String(m.getDate()).padStart(2,"0")}`)(mondayOf(now)),
        thang: thangKK,
        nguoiThucHien: nv,
        ghichu: document.getElementById("kk-ghichu").value.trim(),
        thoiGian: now.toLocaleString("vi-VN"),
        ts: now.getTime(),
        dungHan,
        daDieuChinh: dieuChinh,
        items
      });

      if (dieuChinh) {
        for (const p of PARTS) {
          const it = items[p.ma]; const l = it.thucTe - it.heThong;
          if (l === 0) continue;
          await push(ref(db, "giaodich"), {
            id: Date.now() + Math.floor(Math.random()*1000),
            loai: l > 0 ? "nhap" : "xuat",
            ma: p.ma, soLuong: Math.abs(l),
            giaBan: l > 0 ? null : p.giaChi,          // lệch thiếu tính theo giá vốn → quỹ baga = 0
            ghichu: `[KIỂM KÊ ${key}] điều chỉnh ${l>0?"+":""}${l}`,
            thang: thangKK, nguoiThucHien: nv,
            thoiGian: now.toLocaleString("vi-VN")
          });
        }
      }
      closeModalKK();
      toast(dieuChinh ? "✓ Đã lưu kiểm kê + điều chỉnh tồn" : "✓ Đã lưu biên bản kiểm kê");
    } catch (e) {
      toast("Lỗi lưu kiểm kê: " + e.message + ". Kiểm tra mạng rồi thử lại.", true);
    } finally { btn.disabled = false; btn.textContent = lbl; }
  };

  window.xoaKK = async function(key) {
    if (!confirm("Xoá biên bản kiểm kê " + tuanLabel(key) + "?")) return;
    try { await remove(ref(db, "kiemke/" + key)); toast("Đã xoá biên bản"); }
    catch (e) { toast("Lỗi xoá: " + e.message, true); }
  };

  // ── Toast ────────────────────────────────────────
  let toastTimer = null;
  function toast(msg, err=false) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.className = "toast" + (err?" err":"");
    el.style.display = "block";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ el.style.display="none"; }, 2500);
  }

  // ── Render ───────────────────────────────────────
  function render() {
    const ton = tinhTon(thang);
    const gdArr = Object.entries(giaoDich)
      .map(([k,v])=>({...v,_key:k}))
      .filter(g=>g.thang===thang)
      .sort((a,b)=>b.id-a.id);
    const ttArr = Object.entries(thanhToan)
      .map(([k,v])=>({...v,_key:k}))
      .filter(t=>t.thang===thang)
      .sort((a,b)=>b.id-a.id);
    const tongBaga = Object.values(ton).reduce((s,d)=>s+d.quybaga,0);

    // Thang selector options
    document.getElementById("thang-select").innerHTML = THANG_OPTIONS
      .map(t=>`<option value="${t}"${t===thang?" selected":""}>${thangLabel(t)}</option>`).join("");

    // Active tab
    document.querySelectorAll(".tab-btn").forEach(b=>{
      b.classList.toggle("active", b.dataset.tab===tab);
    });

    // Content
    const content = document.getElementById("content");

    // ── TỒN KHO ─────────────────────────────────
    if (tab === "tonkho") {
      content.innerHTML = `
        <div class="row-between" style="margin-bottom:16px">
          <span style="color:#888;font-size:12px">Xuất nhập tồn — ${thangLabel(thang)}</span>
          <div style="display:flex;gap:8px">
            <button class="btn btn-green" onclick="openModal('nhap')">+ NHẬP HÀNG</button>
            <button class="btn btn-orange" onclick="openModal('xuat')">− XUẤT BÁN</button>
          </div>
        </div>
        <div class="card" style="overflow:auto">
          <table>
            <thead><tr>
              <th>TÊN PHỤ TÙNG</th><th>MÃ</th>
              <th class="r">GIÁ VỐN</th><th class="r">TỒN ĐẦU</th>

  window.suaGD = function(key) {

  // ── Modal nhập/xuất ──────────────────────────────
  window.openModal = function(loai, maDefault="", editKey=null) {
    editingKey = editKey;
    const editData = editKey ? giaoDich[editKey] : null;
    const ton = tinhTon(thang);
    document.getElementById("modal-title-badge").className = loai==="nhap"?"badge-nhap":"badge-xuat";
    document.getElementById("modal-title-badge").textContent = loai==="nhap"?"NHẬP HÀNG":"XUẤT BÁN";
    document.getElementById("modal-title-text").textContent = loai==="nhap"?"Honda giao hàng":"Ghi nhận xuất bán";

    const thangSel = document.getElementById("m-thang");
    thangSel.innerHTML = THANG_OPTIONS.map(t=>`<option value="${t}"${t===(editData?.thang||thang)?" selected":""}>${thangLabel(t)}</option>`).join("");

    const maSel = document.getElementById("m-ma");
    maSel.innerHTML = `<option value="">— Chọn phụ tùng —</option>`
      + PARTS.map(p=>`<option value="${p.ma}"${p.ma===(editData?.ma||maDefault)?" selected":""}>${p.ten}${loai==="xuat"?" (tồn: "+(ton[p.ma]?.tonCuoi??0)+")":""}</option>`).join("");

    document.getElementById("m-sl").value    = editData?.soLuong ?? "";
    document.getElementById("m-gia").value   = editData?.giaBan  ?? "";
    document.getElementById("m-ghichu").value= editData?.ghichu  ?? "";
    document.getElementById("m-nv").value    = editData?.nguoiThucHien ?? "";
    const giaRow = document.getElementById("m-gia-row");
    giaRow.style.display = loai==="xuat"?"block":"none";
    document.getElementById("m-baga-preview").textContent="";

    document.getElementById("m-loai").value = loai;
    document.getElementById("m-save").className = `btn ${loai==="nhap"?"btn-green":"btn-orange"}`;
    document.getElementById("m-save").textContent = editKey
      ? (loai==="nhap"?"✓ CẬP NHẬT NHẬP":"✓ CẬP NHẬT XUẤT")
      : (loai==="nhap"?"✓ LƯU NHẬP":"✓ LƯU XUẤT");

    // Preview baga
    function updatePreview() {
      const ma = maSel.value, gb = parseInt(document.getElementById("m-gia").value), sl = parseInt(document.getElementById("m-sl").value)||1;
      const p = PARTS.find(x=>x.ma===ma);
      if (p && gb>0) document.getElementById("m-baga-preview").textContent = `→ Quỹ baga: ${fmtNum((gb-p.giaChi)*sl)}đ`;
      else document.getElementById("m-baga-preview").textContent="";
    }
    document.getElementById("m-gia").oninput = updatePreview;
    document.getElementById("m-sl").oninput   = updatePreview;
    maSel.onchange = updatePreview;

    document.getElementById("modal").style.display="flex";
    document.getElementById("m-nv").focus();
  };

  window.closeModal = function() { document.getElementById("modal").style.display="none"; editingKey=null; };

  window.saveGD = async function() {
    const loai  = document.getElementById("m-loai").value;
    const ma    = document.getElementById("m-ma").value;
    const sl    = parseInt(document.getElementById("m-sl").value);
    const gbRaw = document.getElementById("m-gia").value.trim();
    const gb    = gbRaw === "" ? NaN : parseInt(gbRaw);
    const ghichu= document.getElementById("m-ghichu").value.trim();
    const thangGD = document.getElementById("m-thang").value;
    const ton   = tinhTon(thangGD);

    const nv    = document.getElementById("m-nv").value;
    if (!nv)            return toast("Vui lòng chọn người thực hiện", true);
    if (!ma)            return toast("Vui lòng chọn phụ tùng", true);
    if (!sl||sl<=0)     return toast("Số lượng không hợp lệ", true);
    if (loai==="xuat"){
      if (Number.isNaN(gb)||gb<0)   return toast("Vui lòng nhập giá bán hợp lệ (≥ 0)", true);
      // Tồn khả dụng: khi SỬA giao dịch xuất cùng mã + cùng tháng,
      // phải cộng lại số lượng cũ (vì nó đã bị trừ vào tồn hiện tại)
      let tonKhaDung = ton[ma]?.tonCuoi ?? 0;
      if (editingKey) {
        const old = giaoDich[editingKey];
        if (old && old.loai==="xuat" && old.ma===ma && old.thang===thangGD) {
          tonKhaDung += old.soLuong;
        }
      }
      if (sl > tonKhaDung) return toast(`Tồn kho chỉ còn ${tonKhaDung} cái`, true);
    }
    const btn = document.getElementById("m-save");
    const btnLabel = btn.textContent;
    btn.textContent = "Đang lưu…"; btn.disabled = true;

    try {
      if (editingKey) {
        // ── Cập nhật giao dịch hiện có ──
        const existing = giaoDich[editingKey];
        await set(ref(db,"giaodich/"+editingKey), {
          ...existing,
          ma, soLuong: sl,
          giaBan: loai==="xuat"?gb:null, ghichu, thang: thangGD,
          nguoiThucHien: nv,
        });
        editingKey = null;
        closeModal();
        toast("✓ Đã cập nhật giao dịch");
      } else {
        // ── Thêm giao dịch mới ──
        await push(ref(db,"giaodich"), {
          id: Date.now(), loai, ma, soLuong: sl,
          giaBan: loai==="xuat"?gb:null, ghichu, thang: thangGD,
          nguoiThucHien: nv,
          thoiGian: new Date().toLocaleString("vi-VN")
        });
        closeModal();
        toast(loai==="nhap"?"✓ Đã nhập hàng":"✓ Đã ghi xuất bán");
      }
    } catch (e) {
      toast("Lỗi lưu dữ liệu: " + e.message + ". Kiểm tra mạng rồi thử lại.", true);
    } finally {
      btn.disabled = false;
      btn.textContent = btnLabel;
    }
  };

  window.xoaGD = async function(key) {
    if (!confirm("Xoá giao dịch này?")) return;
    try {
      await remove(ref(db,"giaodich/"+key));
      toast("Đã xoá giao dịch");
    } catch (e) { toast("Lỗi xoá: " + e.message, true); }
  };

  window.saveTT = async function() {
    const st = parseInt(document.getElementById("tt-sotien").value);
    const thangTT = document.getElementById("tt-thang").value;
    const ghichu  = document.getElementById("tt-ghichu").value.trim();

    try {
      await push(ref(db,"thanhtoan"), {
        id: Date.now(), soTien: st, ghichu, thang: thangTT,
        thoiGian: new Date().toLocaleString("vi-VN")

    if (!confirm("Xoá lần nộp quỹ vốn này?")) return;
    try {
      await remove(ref(db,"thanhtoan/"+key));
      toast("Đã xoá");
    } catch (e) { toast("Lỗi xoá: " + e.message, true); }
  };

  // ── Tab / Tháng ──────────────────────────────────
  window.setTab = function(t) { tab=t; syncURL(); render(); };
  window.setThang = function(t) { thang=t; syncURL(); render(); };

  // Esc đóng modal
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { closeModal(); closeModalTT(); closeModalKK(); }
  });

  // ── Realtime listeners ───────────────────────────
  let firstLoad = true;
  onValue(ref(db,"giaodich"), snap => {
    giaoDich = snap.val() || {};
    tonCache = {}; // dữ liệu đổi → tính lại tồn
    if (firstLoad) {
      firstLoad = false;
      document.getElementById("loading").style.display="none";
    }
    render();
  }, err => {
    document.getElementById("loading").innerHTML = "❌ Lỗi kết nối Firebase: " + err.message;
  });
  onValue(ref(db,"thanhtoan"), snap => {
    thanhToan = snap.val() || {};
    render();
  });
  onValue(ref(db,"kiemke"), snap => {
    kiemKe = snap.val() || {};
    render();
  });

  // ── Đồng hồ nhắc kiểm kê: kiểm tra mỗi phút ──────
  kiemTraNhac();
  setInterval(kiemTraNhac, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) kiemTraNhac(); });

  // Fallback: ẩn loading sau 8 giây dù sao
  setTimeout(() => {
    document.getElementById("loading").style.display="none";
    render();
  }, 8000);
</script>
